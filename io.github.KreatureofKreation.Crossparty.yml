#
# The Flatpak build recipe. Permissions are added only when a feature needs
# them, each with a reason, so this list stays the full truth about what the
# app can reach. See docs/security.md#sec-005.

id: io.github.KreatureofKreation.Crossparty
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: crossparty

finish-args:
  # Display. Native Wayland only, with no X11 socket: X11 apps can read other
  # apps' keystrokes, including games on XWayland.
  - --socket=wayland
  # GPU acceleration for Qt Quick.
  - --device=dri

modules:
  - name: crossparty
    buildsystem: cmake-ninja
    builddir: true
    # Runs the unit tests inside the build sandbox. A failing test fails the
    # build, so a broken build can never be installed.
    run-tests: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DBUILD_TESTING=ON
    sources:
      - type: dir
        path: .
        skip:
          - .flatpak-builder
          - build
          - build-dir
          - repo
