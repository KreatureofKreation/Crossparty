#
# CodeQL security scanning: looks for security bugs in the C++ code and in
# these workflows on every push and pull request, and weekly, so new CodeQL
# rules are applied to unchanged code too. Results appear in the repo's
# Security tab. See docs/security.md#sec-020.

name: CodeQL

on:
  push:
  pull_request:
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyse:
    name: Analyse ${{ matrix.language }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # The one write permission: uploading results to the Security tab.
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # Both read the source without building it: Qt 6.11 and QtWebEngine
        # are only in the Flatpak SDK, not on GitHub's runners.
        language: [c-cpp, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # The extended set adds more security rules than the default.
          queries: security-extended

      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee  # v4.39.0
        with:
          category: /language:${{ matrix.language }}
